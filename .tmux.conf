# ~/.tmux.conf
# Reload: prefix + r  |  Install plugins: prefix + I

# ── Compatibility ──────────────────────────────────────────────
set -g  default-terminal   "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s  escape-time        10
set -g  focus-events       on

# ── Prefix ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind   C-a send-prefix

# ── Core ───────────────────────────────────────────────────────
set -g base-index        1
set -g pane-base-index   1
set -g renumber-windows  on
set -g history-limit     50000
set -g display-time      3000
set -g status-interval   5
set -g aggressive-resize on

# ── Mouse ──────────────────────────────────────────────────────
set -g mouse on

# ── Clipboard (OSC52) ──────────────────────────────────────────
# tmux relays OSC52 from apps (vim/emacs/nvim) and copy-mode to the
# client terminal, so yanks reach your real clipboard over ssh too.
set -g set-clipboard on

# ── Vi copy-mode (tmux-yank handles clipboard auto cross-platform) ──
set -g mode-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi H     send -X start-of-line
bind -T copy-mode-vi L     send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# ── Splits ─────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window         -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ────────────────────────────────
bind h select-pane  -L
bind j select-pane  -D
bind k select-pane  -U
bind l select-pane  -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ── Reload ─────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "reloaded"

# ── Status bar ─────────────────────────────────────────────────
set -g status-style                 "fg=colour8,bg=colour0"
set -g status-left                  "#[fg=colour4,bold] #S #[fg=colour8,nobold]│ "
set -g status-left-length           24
set -g status-right                 "#[fg=colour8]%H:%M  %d %b "
set -g status-right-length          20
set -g window-status-format         "#[fg=colour8] #I #W "
set -g window-status-current-format "#[fg=colour7,bold] #I #W "
set -g window-status-separator      ""
set -g pane-border-style            "fg=colour0"
set -g pane-active-border-style     "fg=colour4"
set -g message-style                "fg=colour7,bg=colour0"

# ── Plugins ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore  'on'
set -g @continuum-save-interval '15'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim          'session'
set -g @resurrect-strategy-nvim         'session'
set -g @yank_selection                  'clipboard'
set -g @yank_selection_mouse            'clipboard'
set -g @yank_with_mouse                 on

run '~/.tmux/plugins/tpm/tpm'
